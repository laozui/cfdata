plugins {
    id 'com.android.application' version '8.3.2' apply true
}

android {
    namespace 'com.laozui.cfdata'
    compileSdk 34

    defaultConfig {
        applicationId "com.laozui.cfdata"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Go 1.26 的 android/arm、amd64、386 目标都强制 cgo 外部链接，
        // 纯 Go 只能出 arm64。近年真机几乎全为 arm64，故只保留这一个 ABI。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Go 可执行文件以 libcfdata.so 之名放进 jniLibs，由系统解压到只读的
    // nativeLibraryDir 后以子进程执行；必须关闭新式的「直接从 APK 映射」打包。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // Go 自带 -ldflags="-s -w" 已裁剪，别再让 NDK llvm-strip 动它
        doNotStrip '**/libcfdata.so'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        release {
            storeFile file('cfdata.jks')
            storePassword 'cfdata123'
            keyAlias 'cfdata'
            keyPassword 'cfdata123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
